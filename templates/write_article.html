{% extends "base.html" %}
{% block title %}Write an Article | Kinetix Performance Coaching{% endblock %}

{% block content %}
<section class="page-header">
  <div class="wrap">
    <span class="eyebrow">New Article</span>
    <h1>Write an article.</h1>
    <p>Give it a title and write it right here — it publishes straight to the Articles page.</p>
  </div>
</section>

<section class="form-section">
  <div class="wrap">
    <div class="form-card">
      <form id="writeArticleForm" method="post" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="e.g. Why Protein Timing Matters Less Than You Think" value="{{ form_data.get('title', '') }}">
        </div>

        <div class="field">
          <label for="body">Article</label>
          <textarea id="body" name="body" placeholder="Write your article here...">{{ form_data.get('body', '') }}</textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-gold">Publish Article</button>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
  (function(){
    const form = document.getElementById('writeArticleForm');
    form.addEventListener('submit', function(e){
      const title = document.getElementById('title').value.trim();
      const body = document.getElementById('body').value.trim();
      const errors = [];

      if (!title) errors.push('Title is required.');
      if (!body) errors.push("The article can't be empty.");

      if (errors.length) {
        e.preventDefault();
        window.showValidationModal(errors);
      }
    });
  })();
</script>
{% endblock %}
