{% extends "base.html" %}
{% block title %}Edit Article | Kinetix Performance Coaching{% endblock %}

{% block content %}
<section class="page-header">
  <div class="wrap">
    <span class="eyebrow">Edit Article</span>
    <h1>{{ article.title }}</h1>
    <p>Update the text below, or delete this article from the site entirely.</p>
  </div>
</section>

<section class="form-section">
  <div class="wrap">
    <div class="form-card">
      <form id="editArticleForm" method="post" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" value="{{ article.title }}">
        </div>

        <div class="field">
          <label for="body">Article</label>
          <textarea id="body" name="body">{{ article.body }}</textarea>
        </div>

        <div class="form-actions" style="justify-content:space-between;">
          <button type="button" class="btn btn-ghost" style="border-color:var(--error);color:var(--error);" id="deleteArticleBtn">Delete Article</button>
          <button type="submit" class="btn btn-gold">Save Changes</button>
        </div>
      </form>

      <form id="deleteArticleForm" action="{{ url_for('articles.delete', article_id=article.id) }}" method="post" style="display:none;"></form>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
  (function(){
    const form = document.getElementById('editArticleForm');
    form.addEventListener('submit', function(e){
      const title = document.getElementById('title').value.trim();
      const body = document.getElementById('body').value.trim();
      const errors = [];

      if (!title) errors.push('Title is required.');
      if (!body) errors.push("The article can't be empty.");

      if (errors.length) {
        e.preventDefault();
        window.showValidationModal(errors);
      }
    });

    document.getElementById('deleteArticleBtn').addEventListener('click', function(){
      if (confirm('Delete this article? This can\'t be undone.')) {
        document.getElementById('deleteArticleForm').submit();
      }
    });
  })();
</script>
{% endblock %}
